<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HowlNotes</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <h1 class="logo">HowlNotes</h1>
          <span class="badge">Dogfooding HowlFrame</span>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div id="status-banner" class="status-banner" style="display: none;"></div>

      <section class="card create-card">
        <h2 class="card-title">Create Note</h2>
        <div class="form-group">
          <textarea id="new-note-content" class="textarea-input" placeholder="Type your note content here..." rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button id="create-btn" class="btn btn-primary">Create Note</button>
        </div>
      </section>

      <section class="notes-section">
        <div class="notes-header">
          <h2 class="section-title">Saved Notes</h2>
          <div class="search-bar">
            <input type="text" id="search-input" class="search-input" placeholder="Filter notes...">
          </div>
        </div>
        <div id="notes-container" class="notes-grid">
          <div class="loading-state">Loading notes...</div>
        </div>
      </section>
    </main>

    <div id="edit-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3 class="modal-title">Edit Note</h3>
        <input type="hidden" id="edit-note-id">
        <div class="form-group">
          <textarea id="edit-note-content" class="textarea-input" rows="4"></textarea>
        </div>
        <div class="modal-actions">
          <button id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
          <button id="save-edit-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
