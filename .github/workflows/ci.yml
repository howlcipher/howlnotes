name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test HowlNotes
    runs-on: ubuntu-latest
    steps:
      - name: Check out HowlNotes repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Bootstrap HowlFrame
        run: ./scripts/bootstrap.sh

      - name: Build HowlNotes
        run: ./scripts/build.sh

      - name: Run Test Suite
        run: ./scripts/test.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium

      - name: Run browser regressions
        env:
          HOWL_FORBID_LOCAL_INFERENCE: '1'
        run: |
          ./scripts/run.sh > build/browser-server.log 2>&1 &
          notes_server_pid=$!
          trap 'kill "$notes_server_pid" 2>/dev/null || true; wait "$notes_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8088/api/health > /dev/null; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:8088/api/health > /dev/null
          python3 tests/browser_test.py

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            build/browser-evidence/
            build/browser-server.log

      - name: Verify SEO Metadata & Artifacts
        run: python3 scripts/test_seo.py

